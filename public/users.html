<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado de Usuarios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Usuarios Registrados</h1>
    
    <div id="usersTable" class="table-container">
      <table class="users-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Fecha de Registro</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <!-- Users will be populated here -->
        </tbody>
      </table>
    </div>
    
    <div id="noUsers" class="message">No hay usuarios registrados</div>
    
    <nav class="nav">
      <a href="/" class="nav-link">Registro</a>
      <a href="/users" class="nav-link active">Ver Usuarios</a>
    </nav>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>Editar Usuario</h2>
      <form id="editForm">
        <input type="hidden" id="editUserId">
        <div class="form-group">
          <label for="editName">Nombre:</label>
          <input type="text" id="editName" required>
        </div>
        <div class="form-group">
          <label for="editEmail">Email:</label>
          <input type="email" id="editEmail" required>
        </div>
        <div class="form-group">
          <label for="editPhone">Teléfono:</label>
          <input type="tel" id="editPhone" required>
        </div>
        <div class="modal-buttons">
          <button type="submit" class="btn">Guardar</button>
          <button type="button" class="btn-cancel" id="cancelEditBtn">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="users-script.js"></script>
</body>
</html>
